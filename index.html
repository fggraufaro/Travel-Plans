<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europa 2026 — Bélgica &amp; Francia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#F1F5F9;
    --surface:#FFFFFF;
    --surface-2:#E7ECF3;
    --ink:#16233F;
    --ink-soft:#4C5A78;
    --ink-faint:#8792AA;
    --line:#DAE1EB;
    --line-strong:#C2CCDC;
    --accent:#DB9A34;
    --accent-strong:#B87B1E;
    --accent-ink:#4A3106;
    --coral:#D2584A;
    --teal:#1E6F78;
    --sky:#3E6FB5;
    --page-notch:#F1F5F9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1424; --surface:#161F36; --surface-2:#1E2A48; --ink:#ECF1FA; --ink-soft:#A9B4CC;
      --ink-faint:#748099; --line:#2A3757; --line-strong:#374873; --accent:#EFB35D;
      --accent-strong:#F5C989; --accent-ink:#2E1D04; --coral:#E8897C; --teal:#5FC3CB;
      --sky:#8AB4E8; --page-notch:#0E1424;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1424; --surface:#161F36; --surface-2:#1E2A48; --ink:#ECF1FA; --ink-soft:#A9B4CC;
    --ink-faint:#748099; --line:#2A3757; --line-strong:#374873; --accent:#EFB35D;
    --accent-strong:#F5C989; --accent-ink:#2E1D04; --coral:#E8897C; --teal:#5FC3CB;
    --sky:#8AB4E8; --page-notch:#0E1424;
  }

  *{ box-sizing:border-box; }
  html{ font-size:120%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; line-height:1.45; }
  #app{ max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1,h2,h3{ text-wrap:balance; margin:0; }

  .app-head{ display:flex; align-items:center; gap:8px; padding:4px 2px 14px; }
  .app-head svg{ width:18px; height:18px; color:var(--coral); flex:none; transform:rotate(45deg); }
  .app-head span{ flex:1; font-family:"IBM Plex Mono", monospace; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); }
  .help-toggle{ width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); font-family:"IBM Plex Sans"; font-weight:600; font-size:.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; }
  .help-toggle:hover{ border-color:var(--teal); color:var(--teal); }

  .help-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:16px; }
  .help-block + .help-block{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line-strong); }
  .help-block h4{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.02rem; margin-bottom:8px; color:var(--ink); }
  .help-block ul{ margin:0; padding-left:18px; font-size:.9rem; color:var(--ink-soft); line-height:1.6; }
  .help-block li + li{ margin-top:4px; }

  .trip-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:14px; }
  .trip-tab{ flex:none; font-family:"IBM Plex Sans"; font-size:.95rem; font-weight:500; padding:10px 16px; min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .trip-tab[aria-selected="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }

  .hero{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px 20px 20px; margin-bottom:22px; overflow:hidden; }
  .hero::before{ content:""; position:absolute; inset:0 0 auto 0; height:5px; background:repeating-linear-gradient(90deg, var(--coral) 0 14px, var(--accent) 14px 28px); }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:10px; }
  .hero h1{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:clamp(1.6rem,7vw,2.1rem); margin-bottom:8px; }
  .hero .dates{ font-family:"Fraunces", Georgia, serif; font-weight:500; color:var(--ink); font-size:1.15rem; margin-bottom:14px; }
  .hero .stats{ display:flex; gap:18px; flex-wrap:wrap; border-top:1px dashed var(--line-strong); padding-top:14px; }
  .hero .stat b{ display:block; font-family:"IBM Plex Mono"; font-size:1.3rem; }
  .hero .stat span{ font-size:.85rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .hero .countdown{ flex:none; text-align:right; white-space:nowrap; }
  .hero .countdown b{ display:block; font-family:"IBM Plex Mono"; font-size:1.5rem; color:var(--coral); }
  .hero .countdown span{ font-size:.8rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }

  .day{ margin-bottom:26px; }
  .day h2{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.25rem; color:var(--ink); margin-bottom:12px; padding-left:2px; }
  .items{ display:flex; flex-direction:column; gap:12px; }

  .item{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
  .item-top{ display:flex; align-items:flex-start; gap:14px; padding:16px; }
  .item-icon{ flex:none; width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--ink); }
  .item-icon svg{ width:24px; height:24px; }
  .item-icon.flight{ color:var(--coral); }
  .item-icon.hotel{ color:var(--teal); }
  .item-icon.car{ color:var(--accent-strong); }
  .item-icon.train{ color:var(--sky); }
  .item-icon.activity{ color:var(--coral); }
  .item-icon.note{ color:var(--ink-soft); }
  .item-main{ flex:1; min-width:0; }
  .item-time{ font-family:"IBM Plex Mono"; font-size:.95rem; font-weight:500; color:var(--ink-soft); }
  .item-title{ display:block; font-weight:600; font-size:1.12rem; margin-top:2px; text-wrap:balance; }
  .item-loc{ display:inline-flex; align-items:center; gap:5px; font-size:.98rem; color:var(--teal); margin-top:3px; text-decoration:none; }
  .item-loc svg{ width:15px; height:15px; flex:none; }
  .item-loc:hover{ text-decoration:underline; }
  .item-route{ font-size:1.05rem; font-weight:600; color:var(--ink); margin-top:2px; line-height:1.5; }
  .place-link{ color:inherit; text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--ink-faint); text-underline-offset:3px; }
  .place-link:hover{ text-decoration-style:solid; text-decoration-color:currentColor; }
  .item-route .t{ font-family:"IBM Plex Mono"; font-weight:500; font-size:.92rem; color:var(--ink-soft); }
  .item-route .arrow{ color:var(--ink-faint); margin:0 3px; }
  .item-sub{ font-size:.88rem; color:var(--ink-faint); margin-top:2px; }
  .item-menu{ flex:none; display:flex; }
  .travelers{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .traveler-chip{ font-size:.8rem; font-weight:500; padding:3px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); }

  .tear{ position:relative; border-top:1.5px dashed var(--line-strong); }
  .tear::before, .tear::after{ content:""; position:absolute; top:-7px; width:14px; height:14px; border-radius:50%; background:var(--page-notch); }
  .tear::before{ left:-7px; } .tear::after{ right:-7px; }
  .item-bottom{ display:flex; flex-direction:column; gap:9px; padding:10px 12px 10px 16px; }
  .conf-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .conf-row.clickable{ cursor:pointer; }
  .conf{ font-size:.92rem; color:var(--ink-soft); }
  .conf b{ font-family:"IBM Plex Mono"; color:var(--ink); letter-spacing:.03em; font-size:1.02rem; }
  .item-details{ padding:0 16px 16px; font-size:1rem; color:var(--ink-soft); line-height:1.55; display:none; }
  .item-details.open{ display:block; }
  .chevron{ width:20px; height:20px; color:var(--ink-soft); flex:none; transition:transform .15s; }
  .chevron.open{ transform:rotate(180deg); }

  .footer-note{ text-align:center; font-size:.85rem; color:var(--ink-faint); margin-top:30px; padding:0 10px; }
  .footer-note a{ color:var(--teal); }

  .view-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .view-btn{ flex:1; font-family:"IBM Plex Sans"; font-weight:500; font-size:.92rem; padding:10px; min-height:44px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; }
  .view-btn[aria-selected="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }

  .filter-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .filter-chip{ font-family:"IBM Plex Sans"; font-weight:500; font-size:.9rem; padding:9px 15px; min-height:40px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; }
  .filter-chip[aria-pressed="true"]{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .filter-empty-note{ text-align:center; color:var(--ink-faint); font-size:.92rem; padding:24px 10px; }

  .cal-month{ margin-bottom:24px; }
  .cal-month h3{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.15rem; margin-bottom:10px; color:var(--ink); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-wd{ text-align:center; font-size:.7rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; padding-bottom:4px; }
  .cal-cell{ aspect-ratio:1; border:1px solid var(--line); border-radius:8px; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-family:"IBM Plex Mono"; font-size:.85rem; color:var(--ink); padding:2px; }
  .cal-cell.empty{ border:none; background:transparent; }
  .cal-cell.out{ opacity:.35; }
  .cal-cell.today{ border-color:var(--coral); border-width:2px; }
  .cal-cell.staying{ background:color-mix(in srgb, var(--teal) 16%, var(--surface)); }
  .cal-cell.has-items{ cursor:pointer; font-weight:600; }
  .cal-cell.has-items:hover{ border-color:var(--ink-faint); }
  .cal-cell.selected{ outline:2px solid var(--ink); outline-offset:1px; }
  .cal-dots{ display:flex; gap:2px; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--ink-faint); }
  .cal-dot.flight, .cal-dot.activity{ background:var(--coral); }
  .cal-dot.train{ background:var(--sky); }
  .cal-dot.car{ background:var(--accent-strong); }
  .cal-dot.hotel{ background:var(--teal); }
  .cal-dot.note{ background:var(--ink-soft); }

  .fab{ position:fixed; right:20px; bottom:24px; width:56px; height:56px; border-radius:50%; background:var(--coral); color:#fff; border:none; box-shadow:0 8px 20px -6px rgb(0 0 0 / .4); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20; }
  .fab svg{ width:24px; height:24px; }

  .overlay{ position:fixed; inset:0; background:rgb(10 14 26 / .5); z-index:30; display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ background:var(--bg); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:18px 18px 26px; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-head h3{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.2rem; }
  .sheet-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
  .icon-btn{ width:40px; height:40px; border-radius:10px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .icon-btn svg{ width:20px; height:20px; }

  .btn{ font-family:"IBM Plex Sans"; font-weight:500; font-size:.95rem; padding:11px 16px; min-height:44px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn.primary{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:.82rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:6px; }
  .field textarea{ width:100%; min-height:100px; font-family:"IBM Plex Mono"; font-size:.85rem; padding:11px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); resize:vertical; }
  .field input[type="text"], .field input[type="date"]{ width:100%; font-family:"IBM Plex Sans"; font-size:.95rem; padding:11px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); box-sizing:border-box; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .trip-tab.new-trip{ display:flex; align-items:center; gap:5px; color:var(--ink-soft); background:transparent; border-style:dashed; }
  .trip-tab.new-trip svg{ width:16px; height:16px; }

  .dropzone{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:22px 16px; border:2px dashed var(--line-strong); border-radius:14px; text-align:center; color:var(--ink-soft); font-size:.9rem; cursor:pointer; margin-bottom:14px; }
  .dropzone svg{ width:22px; height:22px; color:var(--ink-faint); }
  .dropzone.dragover{ border-color:var(--teal); background:var(--surface-2); color:var(--ink); }

  .attach-note{ display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--teal); margin:-4px 0 12px; }
  .attach-note svg{ width:16px; height:16px; flex:none; }
  .attachments{ display:flex; flex-wrap:wrap; gap:8px; }
  .attachment-link{ display:inline-flex; align-items:center; gap:5px; font-size:.82rem; font-weight:500; color:var(--teal); text-decoration:none; padding:5px 11px; border-radius:999px; background:var(--surface-2); }
  .attachment-link svg{ width:13px; height:13px; flex:none; }
  .parse-error{ color:#C2493C; font-size:.88rem; margin-top:10px; }
  .parse-success{ color:var(--teal); font-size:.88rem; margin-top:10px; }
  .spinner{ display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid rgb(255 255 255 / .4); border-top-color:#fff; animation:spin .7s linear infinite; vertical-align:-2px; }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<script>
  var PARSE_ENDPOINT = "https://kmbnchjyjoudthrinkcb.supabase.co/functions/v1/parse-booking";
  var TRIPS = [];
  var tripsLoaded = false;
  var tripsLoadError = false;

  var ICONS = {
    plane:'<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
    bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3h4v-3a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v6"/><path d="M3 18h18"/><path d="M3 15v4M21 15v4"/><path d="M7 10V7a1 1 0 0 1 1-1h1"/></svg>',
    car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.4-4.2A2 2 0 0 1 8.3 5.4h7.4a2 2 0 0 1 1.9 1.4L19 11"/><rect x="3" y="11" width="18" height="6.5" rx="2"/><circle cx="7.5" cy="17.7" r="1.4"/><circle cx="16.5" cy="17.7" r="1.4"/></svg>',
    train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="13" rx="5"/><path d="M4 10h16"/><circle cx="8.5" cy="17.3" r="1.3"/><circle cx="15.5" cy="17.3" r="1.3"/><path d="M6.5 16l-2 4M17.5 16l2 4"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.9L20 9l-6.1 1.6L12 16l-1.9-5.4L4 9l6.1-1.1z"/></svg>',
    flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 5h12l-2.2 4L17 13H5"/></svg>',
    chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12l6.5-6.5a3 3 0 0 1 4.24 4.24L11 17.5a5 5 0 1 1-7.07-7.07L11.5 3"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V4.6a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7"/><path d="M6.5 7l.9 12.4a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.4-7-11.5A7 7 0 0 1 19 9.5C19 14.6 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>'
  };
  var TYPE_ICON = { flight:'plane', hotel:'bed', car:'car', train:'train', activity:'star', note:'flag' };
  var TYPE_LABEL = { flight:'Vuelo', hotel:'Alojamiento', car:'Auto', train:'Tren', activity:'Actividad', note:'Nota' };
  var TYPE_LABEL_PLURAL = { flight:'Vuelos', hotel:'Alojamiento', car:'Autos', train:'Trenes', activity:'Actividades', note:'Notas' };
  var TYPE_ORDER = ['flight', 'train', 'hotel', 'car', 'activity', 'note'];

  function mapsUrl(address){
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  }
  function renderLoc(address){
    return '<a class="item-loc" href="' + esc(mapsUrl(address)) + '" target="_blank" rel="noopener">' + ICONS.pin + '<span>' + esc(address) + '</span></a>';
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function parseLocal(str){
    if (!str) return new Date(NaN);
    return new Date(str.indexOf('T') === -1 ? str + 'T00:00:00' : str);
  }
  var LOCALE = 'es-AR';
  function fmtDateHeading(dateStr){
    var s = parseLocal(dateStr).toLocaleDateString(LOCALE, { weekday:'long', month:'long', day:'numeric' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function fmtDateShort(dateStr){
    return parseLocal(dateStr).toLocaleDateString(LOCALE, { month:'short', day:'numeric' });
  }
  function fmtRange(a, b){
    var y1 = parseLocal(a).getFullYear(), y2 = parseLocal(b).getFullYear();
    return parseLocal(a).toLocaleDateString(LOCALE, { month:'short', day:'numeric', year: y1===y2?undefined:'numeric' })
      + ' → ' + parseLocal(b).toLocaleDateString(LOCALE, { month:'short', day:'numeric', year:'numeric' });
  }
  function fmtTime(dt){
    if (!dt || dt.indexOf('T') === -1) return '';
    return parseLocal(dt).toLocaleTimeString(LOCALE, { hour:'numeric', minute:'2-digit' });
  }

  var viewMode = 'feed';
  var selectedDay = null;
  var activeFilters = [];
  var activeTypeFilters = [];
  var activeTripId = pickDefaultTrip();

  function firstName(n){ return (n || '').trim().split(/\s+/)[0]; }
  function allTravelers(trip){
    var seen = {}, names = [];
    trip.items.forEach(function(item){
      (item.travelers || []).forEach(function(n){
        var f = firstName(n);
        if (f && !seen[f]) { seen[f] = true; names.push(f); }
      });
    });
    return names;
  }
  function allTypes(trip){
    var seen = {};
    trip.items.forEach(function(item){ if (item.type) seen[item.type] = true; });
    return TYPE_ORDER.filter(function(t){ return seen[t]; });
  }
  function matchesFilter(item){
    if (activeTypeFilters.length && activeTypeFilters.indexOf(item.type) === -1) return false;
    if (!activeFilters.length) return true;
    if (!item.travelers || !item.travelers.length) return true;
    return item.travelers.some(function(n){ return activeFilters.indexOf(firstName(n)) !== -1; });
  }
  function toggleFilter(name){
    var i = activeFilters.indexOf(name);
    if (i === -1) activeFilters.push(name); else activeFilters.splice(i, 1);
    selectedDay = null;
    render();
  }
  function toggleTypeFilter(type){
    var i = activeTypeFilters.indexOf(type);
    if (i === -1) activeTypeFilters.push(type); else activeTypeFilters.splice(i, 1);
    selectedDay = null;
    render();
  }
  function pickDefaultTrip(){
    var today = new Date(); today.setHours(0,0,0,0);
    var upcoming = TRIPS.filter(function(t){ return parseLocal(t.endDate) >= today; })
      .sort(function(a,b){ return parseLocal(a.startDate) - parseLocal(b.startDate); });
    return (upcoming[0] || TRIPS[TRIPS.length-1] || {}).id;
  }

  function groupByDay(items){
    var sorted = items.slice().sort(function(a,b){ return parseLocal(a.start) - parseLocal(b.start); });
    var groups = [], byDate = {};
    sorted.forEach(function(item){
      var d = (item.start || '').slice(0,10);
      if (!byDate[d]) { byDate[d] = { date:d, items:[] }; groups.push(byDate[d]); }
      byDate[d].items.push(item);
    });
    return groups;
  }

  function fmtDateTime(dt){
    if (!dt) return '';
    var d = parseLocal(dt);
    return d.toLocaleDateString(LOCALE, { month:'short', day:'numeric' }) + ', ' + fmtTime(dt);
  }

  function renderTravelers(item){
    if (!item.travelers || !item.travelers.length) return '';
    return '<div class="travelers">' + item.travelers.map(function(name){
      return '<span class="traveler-chip">' + esc(name.split(' ')[0]) + '</span>';
    }).join('') + '</div>';
  }

  function attachmentOwner(item, filename){
    if (!item.travelers) return null;
    var lower = filename.toLowerCase();
    for (var i = 0; i < item.travelers.length; i++) {
      var fn = firstName(item.travelers[i]);
      if (fn && lower.indexOf(fn.toLowerCase()) === 0) return fn;
    }
    return null;
  }
  function renderAttachments(item){
    if (!item.attachments || !item.attachments.length) return '';
    var visible = item.attachments.filter(function(a){
      var owner = attachmentOwner(item, a.name || '');
      if (!owner) return true; // not named for a specific passenger (e.g. a shared e-receipt) — always show
      return !activeFilters.length || activeFilters.indexOf(owner) !== -1;
    });
    if (!visible.length) return '';
    return '<div class="attachments">' + visible.map(function(a){
      return '<a class="attachment-link" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + ICONS.clip + esc(a.name) + '</a>';
    }).join('') + '</div>';
  }

  function linkPlace(name){
    if (!name) return '';
    return '<a class="place-link" href="' + esc(mapsUrl(name)) + '" target="_blank" rel="noopener">' + esc(name) + '</a>';
  }
  function renderMain(item){
    var isRoute = item.type === 'flight' || item.type === 'train' || item.type === 'car';
    if (isRoute) {
      return (
        '<div class="item-route"><span class="t">' + fmtTime(item.start) + '</span> ' + linkPlace(item.from) +
        '<span class="arrow">→</span><span class="t">' + fmtTime(item.end) + '</span> ' + linkPlace(item.to) + '</div>' +
        '<div class="item-sub">' + esc(item.title) + '</div>' +
        renderTravelers(item)
      );
    }
    if (item.type === 'hotel') {
      var hotelQuery = item.title + (item.address ? ', ' + item.address : '');
      return (
        '<a class="item-title place-link" href="' + esc(mapsUrl(hotelQuery)) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>' +
        '<div class="item-route">' + fmtDateTime(item.start) + '<span class="arrow">→</span>' + fmtDateTime(item.end) + '</div>' +
        (item.address ? renderLoc(item.address) : '') +
        renderTravelers(item)
      );
    }
    var time = fmtTime(item.start);
    var endBadge = '';
    if (item.end && item.end.slice(0,10) !== item.start.slice(0,10)) {
      endBadge = ' <span class="item-time">→ ' + fmtDateShort(item.end) + (fmtTime(item.end) ? ' ' + fmtTime(item.end) : '') + '</span>';
    }
    return (
      '<div class="item-time">' + (time || TYPE_LABEL[item.type] || '') + endBadge + '</div>' +
      '<div class="item-title">' + esc(item.title) + '</div>' +
      (item.location ? renderLoc(item.location) : '') +
      renderTravelers(item)
    );
  }

  function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

  function monthsBetween(startStr, endStr){
    var start = parseLocal(startStr), end = parseLocal(endStr);
    var months = [];
    var cur = new Date(start.getFullYear(), start.getMonth(), 1);
    var last = new Date(end.getFullYear(), end.getMonth(), 1);
    while (cur <= last) {
      months.push({ year: cur.getFullYear(), month: cur.getMonth() });
      cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    }
    return months;
  }

  function buildDayInfo(items){
    var info = {};
    items.forEach(function(item){
      if (item.type === 'hotel' && item.start && item.end) {
        var s = parseLocal(item.start), e = parseLocal(item.end);
        var cursor = new Date(s.getFullYear(), s.getMonth(), s.getDate());
        var endDay = new Date(e.getFullYear(), e.getMonth(), e.getDate());
        while (cursor < endDay) {
          var key = ymd(cursor);
          if (!info[key]) info[key] = { dots: [], staying: false };
          info[key].staying = true;
          cursor.setDate(cursor.getDate() + 1);
        }
      } else {
        var key2 = (item.start || '').slice(0, 10);
        if (!key2) return;
        if (!info[key2]) info[key2] = { dots: [], staying: false };
        info[key2].dots.push(item.type);
      }
    });
    return info;
  }

  function renderCalendar(trip, visibleItems){
    var dayInfo = buildDayInfo(visibleItems);
    var months = monthsBetween(trip.startDate, trip.endDate);
    var todayStr = ymd(new Date());
    var html = '';
    months.forEach(function(m){
      var first = new Date(m.year, m.month, 1);
      var daysInMonth = new Date(m.year, m.month + 1, 0).getDate();
      var startWeekday = (first.getDay() + 6) % 7; // Monday = 0
      var monthLabel = first.toLocaleDateString(LOCALE, { month: 'long', year: 'numeric' });
      html += '<div class="cal-month"><h3>' + monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1) + '</h3>';
      html += '<div class="cal-grid">' + ['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(function(w){ return '<div class="cal-wd">' + w + '</div>'; }).join('') + '</div>';
      html += '<div class="cal-grid">';
      for (var i = 0; i < startWeekday; i++) html += '<div class="cal-cell empty"></div>';
      for (var day = 1; day <= daysInMonth; day++) {
        var d = new Date(m.year, m.month, day);
        var key = ymd(d);
        var info = dayInfo[key] || { dots: [], staying: false };
        var inRange = key >= trip.startDate && key <= trip.endDate;
        var hasItems = info.dots.length > 0;
        var cls = 'cal-cell' + (inRange ? '' : ' out') + (key === todayStr ? ' today' : '') +
          (info.staying ? ' staying' : '') + (hasItems ? ' has-items' : '') + (key === selectedDay ? ' selected' : '');
        var dotsHtml = info.dots.slice(0, 4).map(function(t){ return '<span class="cal-dot ' + t + '"></span>'; }).join('');
        html += '<button type="button" class="' + cls + '"' + (hasItems ? ' onclick="selectDay(\'' + key + '\')"' : '') + '>' +
          '<span>' + day + '</span>' + (dotsHtml ? '<span class="cal-dots">' + dotsHtml + '</span>' : '') +
        '</button>';
      }
      html += '</div></div>';
    });
    if (selectedDay && dayInfo[selectedDay] && dayInfo[selectedDay].dots.length) {
      var dayItems = visibleItems.filter(function(it){ return it.type !== 'hotel' && (it.start || '').slice(0, 10) === selectedDay; });
      html += '<div class="day" style="margin-top:8px"><h2>' + fmtDateHeading(selectedDay) + '</h2><div class="items">' +
        dayItems.map(renderItem).join('') + '</div></div>';
    }
    return html;
  }

  function renderItem(item){
    var icon = ICONS[TYPE_ICON[item.type] || 'flag'];
    var atts = renderAttachments(item);
    var hasConf = item.confirmation || item.provider;
    var hasDetails = !!item.details;
    var hasBottom = hasConf || hasDetails || atts;
    var uid = 'd_' + Math.random().toString(36).slice(2,8);
    return (
      '<div class="item">' +
      '<div class="item-top">' +
        '<div class="item-icon ' + item.type + '">' + icon + '</div>' +
        '<div class="item-main">' + renderMain(item) + '</div>' +
        (item.id ? '<div class="item-menu"><button class="icon-btn" onclick="deleteBooking(\'' + esc(item.id) + '\')" aria-label="Eliminar">' + ICONS.trash + '</button></div>' : '') +
      '</div>' +
      (hasBottom ? '<div class="tear"></div><div class="item-bottom">' +
        ((hasConf || hasDetails) ? '<div class="conf-row' + (hasDetails ? ' clickable' : '') + '"' + (hasDetails ? ' onclick="toggleDetails(\'' + uid + '\', this)"' : '') + '>' +
          '<div class="conf">' + esc(item.provider || '') + (item.confirmation ? (item.provider ? ' · ' : '') + 'Conf. <b>' + esc(item.confirmation) + '</b>' : '') + '</div>' +
          (hasDetails ? '<span class="chevron">' + ICONS.chevron + '</span>' : '') +
        '</div>' : '') +
        atts +
      '</div>' : '') +
      (hasDetails ? '<div class="item-details" id="' + uid + '">' + esc(item.details || '') + '</div>' : '') +
      '</div>'
    );
  }

  var helpOpen = false;
  function toggleHelp(){ helpOpen = !helpOpen; render(); }
  function renderHelp(){
    return (
      '<div class="help-card">' +
      '<div class="help-block"><h4>Para quien mira el itinerario</h4>' +
        '<ul>' +
        '<li>Tocá <b>Lista</b> para ver todo en orden, o <b>Calendario</b> para verlo por fecha.</li>' +
        '<li>Tocá cualquier reserva para ver los detalles y el número de confirmación.</li>' +
        '<li>Usá los filtros de arriba para ver solo cierto tipo (vuelos, trenes, alojamiento...) o solo las reservas de una persona.</li>' +
        '</ul></div>' +
      '<div class="help-block"><h4>Para quien agrega una reserva</h4>' +
        '<ul>' +
        '<li>Tocá el botón <b>+</b> (abajo a la derecha).</li>' +
        '<li>Arrastrá el archivo del email de confirmación, o pegá el texto directamente.</li>' +
        '<li>Se procesa automáticamente y la reserva aparece acá en menos de un minuto.</li>' +
        '</ul></div>' +
      '</div>'
    );
  }

  function render(){
    var app = document.getElementById('app');
    var html = '<div class="app-head">' + ICONS.plane + '<span>Planificador de Visitas Familiares</span>' +
      '<button class="help-toggle" onclick="toggleHelp()" aria-label="Cómo funciona">' + (helpOpen ? '✕' : '?') + '</button></div>';
    if (helpOpen) html += renderHelp();

    if (!tripsLoaded) {
      html += tripsLoadError
        ? '<div class="empty">' + ICONS.empty + '<div>No se pudo cargar el itinerario. Recargá la página.</div></div>'
        : '<div class="empty">' + ICONS.empty + '<div>Cargando…</div></div>';
      app.innerHTML = html;
      return;
    }

    var trip = TRIPS.find(function(t){ return t.id === activeTripId; });

    html += '<div class="trip-tabs">' + TRIPS.map(function(t){
      return '<button class="trip-tab" aria-selected="' + (t.id===activeTripId) + '" onclick="selectTrip(\'' + t.id + '\')">' + esc(t.title) + '</button>';
    }).join('') + '<button class="trip-tab new-trip" onclick="openNewTripPanel()">' + ICONS.plus + '<span>Nuevo viaje</span></button></div>';

    if (trip) {
      var visibleItems = trip.items.filter(matchesFilter);
      var counts = { flight:0, other:0 };
      visibleItems.forEach(function(i){ if (i.type==='flight') counts.flight++; else counts.other++; });
      var today = new Date(); today.setHours(0,0,0,0);
      var days = Math.round((parseLocal(trip.startDate) - today) / 86400000);
      var countdown = '';
      if (days > 1) countdown = '<div class="countdown"><b>' + days + '</b><span>días restantes</span></div>';
      else if (days === 1) countdown = '<div class="countdown"><b>1</b><span>día restante</span></div>';
      else if (days === 0) countdown = '<div class="countdown"><b>Hoy</b><span>empieza</span></div>';
      else if (parseLocal(trip.endDate) >= today) countdown = '<div class="countdown"><b>Ahora</b><span>en curso</span></div>';

      html += '<div class="hero">' +
        (countdown ? '<div class="hero-top"><span></span>' + countdown + '</div>' : '') +
        '<h1>' + trip.title + '</h1>' +
        '<div class="dates">' + fmtRange(trip.startDate, trip.endDate) + '</div>' +
        '<div class="stats">' +
          '<div class="stat"><b>' + counts.flight + '</b><span>Vuelo' + (counts.flight===1?'':'s') + '</span></div>' +
          '<div class="stat"><b>' + counts.other + '</b><span>Otras reservas</span></div>' +
        '</div>' +
      '</div>';

      html += '<div class="view-toggle">' +
        '<button class="view-btn" aria-selected="' + (viewMode==='feed') + '" onclick="setView(\'feed\')">Lista</button>' +
        '<button class="view-btn" aria-selected="' + (viewMode==='calendar') + '" onclick="setView(\'calendar\')">Calendario</button>' +
      '</div>';

      var types = allTypes(trip);
      if (types.length > 1) {
        html += '<div class="filter-row filter-row-types">' + types.map(function(type){
          var pressed = activeTypeFilters.indexOf(type) !== -1;
          return '<button type="button" class="filter-chip" aria-pressed="' + pressed + '" onclick="toggleTypeFilter(\'' + type + '\')">' + esc(TYPE_LABEL_PLURAL[type] || type) + '</button>';
        }).join('') + '</div>';
      }

      var travelers = allTravelers(trip);
      if (travelers.length) {
        html += '<div class="filter-row">' + travelers.map(function(name){
          var pressed = activeFilters.indexOf(name) !== -1;
          return '<button type="button" class="filter-chip" aria-pressed="' + pressed + '" onclick="toggleFilter(\'' + esc(name).replace(/'/g,"\\'") + '\')">' + esc(name.split(' ')[0]) + '</button>';
        }).join('') + '</div>';
      }

      if (viewMode === 'calendar') {
        html += renderCalendar(trip, visibleItems);
      } else if (!visibleItems.length) {
        html += '<div class="filter-empty-note">Ningún resultado coincide con este filtro.</div>';
      } else {
        var groups = groupByDay(visibleItems);
        groups.forEach(function(g){
          html += '<div class="day"><h2>' + fmtDateHeading(g.date) + '</h2><div class="items">' +
            g.items.map(renderItem).join('') + '</div></div>';
        });
      }
    }

    html += '<button class="fab" onclick="openAddPanel()" aria-label="Agregar reserva">' + ICONS.plus + '</button>';
    if (addPanelOpen) html += renderAddPanel();
    if (newTripPanelOpen) html += renderNewTripPanel();

    html += '<div class="footer-note">Arrastrá o subí un email de confirmación con el botón + para agregarlo — ' +
      'mirá el <a href="https://github.com/fggraufaro/Travel-Plans" target="_blank" rel="noopener">código fuente en GitHub</a>.</div>';

    app.innerHTML = html;
  }

  // ---------------- add booking (drop zone) ----------------
  var addPanelOpen = false;
  var addPasteText = '';
  var addAttachments = [];
  var addSubmitting = false;
  var addError = '';
  var addSuccess = '';

  function openAddPanel(){ addPanelOpen = true; addError = ''; addSuccess = ''; addAttachments = []; render(); }
  function closeAddPanel(){ addPanelOpen = false; addPasteText = ''; addError = ''; addSuccess = ''; addAttachments = []; render(); }

  function renderAddPanel(){
    return (
      '<div class="overlay" onclick="if(event.target===this)closeAddPanel()"><div class="sheet">' +
      '<div class="sheet-head"><h3>Agregar reserva</h3><button class="icon-btn" onclick="closeAddPanel()">' + ICONS.x + '</button></div>' +
      '<div id="dropzone" class="dropzone" ondragover="event.preventDefault()" ondragenter="onDropzoneEnter(event)" ondragleave="onDropzoneLeave(event)" ondrop="onDropzoneDrop(event)" onclick="document.getElementById(\'file-input\').click()">' +
        ICONS.mail + '<span>Arrastrá un email acá, o tocá para elegir un archivo</span>' +
        '<input type="file" id="file-input" accept=".eml,.txt,text/plain,message/rfc822" style="display:none" onchange="onFileInputChange(event)">' +
      '</div>' +
      '<div class="field"><label>O pegá el texto del email</label><textarea id="paste-text" oninput="addPasteText=this.value" placeholder="Pegá acá el email de confirmación...">' + esc(addPasteText) + '</textarea></div>' +
      (addAttachments.length ? '<div class="attach-note">' + ICONS.mail + esc(addAttachments.length + (addAttachments.length===1?' archivo adjunto detectado (se va a guardar con la reserva)':' archivos adjuntos detectados (se van a guardar con la reserva)')) + '</div>' : '') +
      '<div class="sheet-actions"><button class="btn" onclick="closeAddPanel()">Cancelar</button>' +
      '<button class="btn primary" onclick="submitBooking()" ' + (addSubmitting ? 'disabled' : '') + '>' + (addSubmitting ? '<span class="spinner"></span> Procesando…' : 'Analizar y guardar') + '</button></div>' +
      (addError ? '<div class="parse-error">' + esc(addError) + '</div>' : '') +
      (addSuccess ? '<div class="parse-success">' + esc(addSuccess) + '</div>' : '') +
      '</div></div>'
    );
  }

  // ---------------- new trip ----------------
  var newTripPanelOpen = false;
  var newTripTitle = '';
  var newTripStart = '';
  var newTripEnd = '';
  var newTripSubmitting = false;
  var newTripError = '';

  function openNewTripPanel(){ newTripPanelOpen = true; newTripTitle = ''; newTripStart = ''; newTripEnd = ''; newTripError = ''; render(); }
  function closeNewTripPanel(){ newTripPanelOpen = false; render(); }

  function renderNewTripPanel(){
    return (
      '<div class="overlay" onclick="if(event.target===this)closeNewTripPanel()"><div class="sheet">' +
      '<div class="sheet-head"><h3>Nuevo viaje</h3><button class="icon-btn" onclick="closeNewTripPanel()">' + ICONS.x + '</button></div>' +
      '<div class="field"><label>Nombre</label><input type="text" id="new-trip-title" oninput="newTripTitle=this.value" placeholder="Ej: Reino Unido &amp; Portugal" value="' + esc(newTripTitle) + '"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Desde</label><input type="date" id="new-trip-start" oninput="newTripStart=this.value" value="' + esc(newTripStart) + '"></div>' +
        '<div class="field"><label>Hasta</label><input type="date" id="new-trip-end" oninput="newTripEnd=this.value" value="' + esc(newTripEnd) + '"></div>' +
      '</div>' +
      '<div class="sheet-actions"><button class="btn" onclick="closeNewTripPanel()">Cancelar</button>' +
      '<button class="btn primary" onclick="submitNewTrip()" ' + (newTripSubmitting ? 'disabled' : '') + '>' + (newTripSubmitting ? '<span class="spinner"></span> Creando…' : 'Crear viaje') + '</button></div>' +
      (newTripError ? '<div class="parse-error">' + esc(newTripError) + '</div>' : '') +
      '</div></div>'
    );
  }

  async function submitNewTrip(){
    var title = (newTripTitle || '').trim();
    if (!title) { newTripError = 'Ponele un nombre al viaje.'; render(); return; }
    if (!newTripStart || !newTripEnd) { newTripError = 'Elegí las fechas de inicio y fin.'; render(); return; }
    if (newTripEnd < newTripStart) { newTripError = 'La fecha de fin no puede ser antes que la de inicio.'; render(); return; }
    newTripSubmitting = true; newTripError = ''; render();
    try {
      var res = await fetch(PARSE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'create_trip', title: title, startDate: newTripStart, endDate: newTripEnd })
      });
      var data = await res.json();
      newTripSubmitting = false;
      if (!res.ok || data.error) {
        newTripError = (data.error || 'Algo salió mal. Probá de nuevo en un momento.') + (data.detail ? ' — ' + String(data.detail).slice(0, 300) : '');
        render();
        return;
      }
      newTripPanelOpen = false;
      if (data.trip) {
        TRIPS.push(data.trip);
        activeTripId = data.trip.id;
        selectedDay = null;
        activeFilters = [];
        activeTypeFilters = [];
      }
      render();
      setTimeout(function(){ loadTrips(); }, 15000);
    } catch (e) {
      newTripSubmitting = false;
      newTripError = 'No se pudo conectar con el servidor. Probá de nuevo.';
      render();
    }
  }

  function decodeQuotedPrintable(s){
    var joined = s.replace(/=\r?\n/g, '');
    var bytes = [];
    for (var i = 0; i < joined.length; i++) {
      if (joined[i] === '=' && /^[0-9A-Fa-f]{2}$/.test(joined.substr(i + 1, 2))) {
        bytes.push(parseInt(joined.substr(i + 1, 2), 16));
        i += 2;
      } else {
        bytes.push(joined.charCodeAt(i));
      }
    }
    try { return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }
    catch (e) { return joined; }
  }
  function htmlToText(html){
    return html
      .replace(/<style[\s\S]*?<\/style>/gi, ' ')
      .replace(/<script[\s\S]*?<\/script>/gi, ' ')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(p|div|tr|table|li|h[1-6])>/gi, '\n')
      .replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&')
      .replace(/&lt;/gi, '<')
      .replace(/&gt;/gi, '>')
      .replace(/&#39;/gi, "'")
      .replace(/&quot;/gi, '"')
      .replace(/[ \t]+/g, ' ')
      .replace(/\n\s*\n+/g, '\n')
      .trim();
  }
  function decodePart(part){
    var headerEnd = part.search(/\r?\n\r?\n/);
    if (headerEnd === -1) return null;
    var header = part.slice(0, headerEnd);
    var body = part.slice(headerEnd).replace(/^\r?\n\r?\n/, '');
    if (/quoted-printable/i.test(header)) return decodeQuotedPrintable(body);
    if (/base64/i.test(header)) { try { return new TextDecoder('utf-8').decode(Uint8Array.from(atob(body.replace(/\s+/g, '')), function(c){ return c.charCodeAt(0); })); } catch (e) { return null; } }
    return body.trim();
  }
  function splitMimeParts(raw){
    // Collect every boundary declared anywhere in the message (top-level and nested,
    // e.g. multipart/mixed containing multipart/alternative) and split on all of them
    // at once — this flattens nested multipart structures into flat leaf parts without
    // needing a real recursive parser.
    var boundaries = [], re = /boundary="?([^"\r\n;]+)"?/gi, m;
    while ((m = re.exec(raw))) { if (boundaries.indexOf(m[1]) === -1) boundaries.push(m[1]); }
    if (!boundaries.length) return null;
    var escaped = boundaries.map(function(b){ return b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    var splitRe = new RegExp('--(?:' + escaped.join('|') + ')(?:--)?\\r?\\n?');
    return raw.split(splitRe);
  }
  function extractEmailText(raw){
    var parts = splitMimeParts(raw);
    // No multipart structure at all — likely already a simple message; bound it defensively.
    if (!parts) return raw.slice(0, 8000);
    for (var i = 0; i < parts.length; i++) {
      if (/Content-Type:\s*text\/plain/i.test(parts[i]) && !/Content-Disposition:\s*attachment/i.test(parts[i])) {
        var body = decodePart(parts[i]);
        if (body) return body.trim();
      }
    }
    // No plain-text part (common — many providers only send HTML) — use the HTML part instead.
    for (var j = 0; j < parts.length; j++) {
      if (/Content-Type:\s*text\/html/i.test(parts[j]) && !/Content-Disposition:\s*attachment/i.test(parts[j])) {
        var htmlBody = decodePart(parts[j]);
        if (htmlBody) return htmlToText(htmlBody);
      }
    }
    // Neither found (e.g. attachments only) — never fall back to raw MIME with embedded base64 data.
    return '';
  }

  var MAX_ATTACHMENTS_CLIENT = 8;
  function extractAttachments(raw){
    var parts = splitMimeParts(raw);
    if (!parts) return [];
    var out = [];
    for (var i = 0; i < parts.length && out.length < MAX_ATTACHMENTS_CLIENT; i++) {
      var part = parts[i];
      if (!/Content-Disposition:\s*attachment/i.test(part)) continue;
      var headerEnd = part.search(/\r?\n\r?\n/);
      if (headerEnd === -1) continue;
      // Unfold RFC 5322 header continuation lines (long filenames wrap onto an indented next line).
      var header = part.slice(0, headerEnd).replace(/\r?\n[ \t]+/g, ' ');
      if (!/Content-Transfer-Encoding:\s*base64/i.test(header)) continue; // only handle base64 attachments
      var typeMatch = header.match(/Content-Type:\s*([^;\r\n]+)/i);
      var nameMatch = header.match(/filename="?([^"\r\n;]+)"?/i);
      if (!nameMatch) continue;
      var b64 = part.slice(headerEnd).replace(/^\r?\n\r?\n/, '').replace(/[\r\n]+/g, '').trim();
      if (!b64) continue;
      out.push({ filename: nameMatch[1], mimeType: typeMatch ? typeMatch[1].trim() : 'application/octet-stream', base64: b64 });
    }
    return out;
  }

  function loadEmailFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var raw = String(e.target.result || '');
      // Scan the whole file, not just a prefix — real emails (Gmail exports especially) can carry
      // several KB of Received/ARC-Seal/DKIM-Signature relay headers before Content-Type/boundary appear.
      var looksLikeMime = /\.eml$/i.test(file.name || '') || /^Content-Type:|^MIME-Version:|boundary=/im.test(raw);
      addPasteText = looksLikeMime ? extractEmailText(raw) : raw;
      addAttachments = looksLikeMime ? extractAttachments(raw) : [];
      if (!addPasteText.trim()) {
        addError = 'No se encontró texto legible en ese email (puede tener solo archivos adjuntos). Probá pegando el texto a mano.';
        render();
        return;
      }
      addError = '';
      render();
      submitBooking();
    };
    reader.onerror = function(){ addError = 'No se pudo leer ese archivo — probá pegando el texto del email.'; render(); };
    reader.readAsText(file);
  }
  function onDropzoneEnter(ev){ ev.preventDefault(); var dz = document.getElementById('dropzone'); if (dz) dz.classList.add('dragover'); }
  function onDropzoneLeave(ev){ var dz = document.getElementById('dropzone'); if (dz) dz.classList.remove('dragover'); }
  async function onDropzoneDrop(ev){
    ev.preventDefault();
    var dz = document.getElementById('dropzone'); if (dz) dz.classList.remove('dragover');
    var dt = ev.dataTransfer;
    var file = dt && dt.files && dt.files[0];
    if (file) { loadEmailFile(file); return; }
    var downloadUrlData = dt && dt.getData && dt.getData('DownloadURL');
    if (downloadUrlData) {
      var url = downloadUrlData.split(':').slice(2).join(':');
      if (url) {
        try {
          var res = await fetch(url);
          if (!res.ok) throw new Error('fetch failed');
          var text = await res.text();
          var looksLikeMime = /^Content-Type:|^MIME-Version:|boundary=/im.test(text);
          addPasteText = looksLikeMime ? extractEmailText(text) : text;
          addAttachments = looksLikeMime ? extractAttachments(text) : [];
          render();
          submitBooking();
          return;
        } catch (e) { /* fall through */ }
      }
    }
    addError = 'No se pudo leer ese arrastre directamente — guardá el email como archivo primero y soltalo, o elegilo con el botón.';
    render();
  }
  function onFileInputChange(ev){
    var file = ev.target.files && ev.target.files[0];
    if (file) loadEmailFile(file);
  }

  async function deleteBooking(itemId){
    var passkey = prompt('Ingresá la clave para eliminar esta reserva:');
    if (!passkey) return;
    try {
      var res = await fetch(PARSE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', tripId: activeTripId, itemId: itemId, passkey: passkey })
      });
      var data = await res.json();
      if (!res.ok || data.error) {
        alert(data.error || 'No se pudo eliminar.');
        return;
      }
      var trip = TRIPS.find(function(t){ return t.id === activeTripId; });
      if (trip) trip.items = trip.items.filter(function(it){ return it.id !== itemId; });
      render();
    } catch (e) {
      alert('No se pudo conectar con el servidor.');
    }
  }

  async function submitBooking(){
    var text = (addPasteText || '').trim();
    if (!text) { addError = 'Pegá o soltá un email primero.'; render(); return; }
    addSubmitting = true; addError = ''; addSuccess = ''; render();
    try {
      var res = await fetch(PARSE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, attachments: addAttachments, tripId: activeTripId })
      });
      var data = await res.json();
      addSubmitting = false;
      if (!res.ok || data.error) {
        addError = (data.error || 'Algo salió mal. Probá de nuevo en un momento.') + (data.detail ? ' — ' + String(data.detail).slice(0, 300) : '');
        render();
        return;
      }
      if (data.duplicate) {
        addSuccess = 'Esta reserva ya estaba agregada (mismo número de confirmación).';
      } else {
        addSuccess = 'Reserva agregada: ' + (data.booking && data.booking.title ? data.booking.title : '') + '. La página se actualiza en un minuto.';
      }
      addPasteText = '';
      addAttachments = [];
      render();
      setTimeout(function(){ loadTrips(); }, 15000);
    } catch (e) {
      addSubmitting = false;
      addError = 'No se pudo conectar con el servidor. Probá de nuevo.';
      render();
    }
  }

  function selectTrip(id){ activeTripId = id; selectedDay = null; activeFilters = []; activeTypeFilters = []; render(); }
  function setView(v){ viewMode = v; selectedDay = null; render(); }
  function selectDay(key){ selectedDay = (selectedDay === key) ? null : key; render(); }
  function toggleDetails(id, btn){
    var el = document.getElementById(id);
    el.classList.toggle('open');
    btn.querySelector('.chevron').classList.toggle('open');
  }

  function loadTrips(){
    fetch('./trips.json?cb=' + Date.now())
      .then(function(res){ if (!res.ok) throw new Error('bad response'); return res.json(); })
      .then(function(data){
        TRIPS = data.trips || [];
        tripsLoaded = true;
        tripsLoadError = false;
        if (!activeTripId || !TRIPS.some(function(t){ return t.id === activeTripId; })) {
          activeTripId = pickDefaultTrip();
        }
        render();
      })
      .catch(function(){
        tripsLoaded = true;
        tripsLoadError = true;
        render();
      });
  }

  render();
  loadTrips();
</script>
</body>
</html>
