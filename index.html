<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europa 2026 — Belgica &amp; Francia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#F1F5F9;
    --surface:#FFFFFF;
    --surface-2:#E7ECF3;
    --ink:#16233F;
    --ink-soft:#4C5A78;
    --ink-faint:#8792AA;
    --line:#DAE1EB;
    --line-strong:#C2CCDC;
    --accent:#DB9A34;
    --accent-strong:#B87B1E;
    --accent-ink:#4A3106;
    --coral:#D2584A;
    --teal:#1E6F78;
    --sky:#3E6FB5;
    --page-notch:#F1F5F9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1424; --surface:#161F36; --surface-2:#1E2A48; --ink:#ECF1FA; --ink-soft:#A9B4CC;
      --ink-faint:#748099; --line:#2A3757; --line-strong:#374873; --accent:#EFB35D;
      --accent-strong:#F5C989; --accent-ink:#2E1D04; --coral:#E8897C; --teal:#5FC3CB;
      --sky:#8AB4E8; --page-notch:#0E1424;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1424; --surface:#161F36; --surface-2:#1E2A48; --ink:#ECF1FA; --ink-soft:#A9B4CC;
    --ink-faint:#748099; --line:#2A3757; --line-strong:#374873; --accent:#EFB35D;
    --accent-strong:#F5C989; --accent-ink:#2E1D04; --coral:#E8897C; --teal:#5FC3CB;
    --sky:#8AB4E8; --page-notch:#0E1424;
  }

  *{ box-sizing:border-box; }
  html{ font-size:120%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; line-height:1.45; }
  #app{ max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1,h2,h3{ text-wrap:balance; margin:0; }

  .app-head{ display:flex; align-items:center; gap:8px; padding:4px 2px 14px; }
  .app-head svg{ width:18px; height:18px; color:var(--coral); flex:none; transform:rotate(45deg); }
  .app-head span{ font-family:"IBM Plex Mono", monospace; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); }

  .trip-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:14px; }
  .trip-tab{ flex:none; font-family:"IBM Plex Sans"; font-size:.95rem; font-weight:500; padding:10px 16px; min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .trip-tab[aria-selected="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }

  .hero{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px 20px 20px; margin-bottom:22px; overflow:hidden; }
  .hero::before{ content:""; position:absolute; inset:0 0 auto 0; height:5px; background:repeating-linear-gradient(90deg, var(--coral) 0 14px, var(--accent) 14px 28px); }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:10px; }
  .hero h1{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:clamp(1.6rem,7vw,2.1rem); margin-bottom:8px; }
  .hero .dates{ font-family:"Fraunces", Georgia, serif; font-weight:500; color:var(--ink); font-size:1.15rem; margin-bottom:14px; }
  .hero .stats{ display:flex; gap:18px; flex-wrap:wrap; border-top:1px dashed var(--line-strong); padding-top:14px; }
  .hero .stat b{ display:block; font-family:"IBM Plex Mono"; font-size:1.3rem; }
  .hero .stat span{ font-size:.85rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .hero .countdown{ flex:none; text-align:right; white-space:nowrap; }
  .hero .countdown b{ display:block; font-family:"IBM Plex Mono"; font-size:1.5rem; color:var(--coral); }
  .hero .countdown span{ font-size:.8rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }

  .day{ margin-bottom:26px; }
  .day h2{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.25rem; color:var(--ink); margin-bottom:12px; padding-left:2px; }
  .items{ display:flex; flex-direction:column; gap:12px; }

  .item{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
  .item-top{ display:flex; align-items:flex-start; gap:14px; padding:16px; }
  .item-icon{ flex:none; width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--ink); }
  .item-icon svg{ width:24px; height:24px; }
  .item-icon.flight{ color:var(--coral); }
  .item-icon.hotel{ color:var(--teal); }
  .item-icon.car{ color:var(--accent-strong); }
  .item-icon.train{ color:var(--sky); }
  .item-icon.activity{ color:var(--coral); }
  .item-icon.note{ color:var(--ink-soft); }
  .item-main{ flex:1; min-width:0; }
  .item-time{ font-family:"IBM Plex Mono"; font-size:.95rem; font-weight:500; color:var(--ink-soft); }
  .item-title{ font-weight:600; font-size:1.12rem; margin-top:2px; text-wrap:balance; }
  .item-loc{ font-size:.98rem; color:var(--ink-soft); margin-top:3px; }
  .item-route{ font-size:1.05rem; font-weight:600; color:var(--ink); margin-top:2px; line-height:1.5; }
  .item-route .t{ font-family:"IBM Plex Mono"; font-weight:500; font-size:.92rem; color:var(--ink-soft); }
  .item-route .arrow{ color:var(--ink-faint); margin:0 3px; }
  .item-sub{ font-size:.88rem; color:var(--ink-faint); margin-top:2px; }
  .travelers{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .traveler-chip{ font-size:.8rem; font-weight:500; padding:3px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); }

  .tear{ position:relative; border-top:1.5px dashed var(--line-strong); }
  .tear::before, .tear::after{ content:""; position:absolute; top:-7px; width:14px; height:14px; border-radius:50%; background:var(--page-notch); }
  .tear::before{ left:-7px; } .tear::after{ right:-7px; }
  .item-bottom{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px 10px 16px; cursor:pointer; }
  .conf{ font-size:.92rem; color:var(--ink-soft); }
  .conf b{ font-family:"IBM Plex Mono"; color:var(--ink); letter-spacing:.03em; font-size:1.02rem; }
  .item-details{ padding:0 16px 16px; font-size:1rem; color:var(--ink-soft); line-height:1.55; display:none; }
  .item-details.open{ display:block; }
  .chevron{ width:20px; height:20px; color:var(--ink-soft); flex:none; transition:transform .15s; }
  .chevron.open{ transform:rotate(180deg); }

  .footer-note{ text-align:center; font-size:.85rem; color:var(--ink-faint); margin-top:30px; padding:0 10px; }
  .footer-note a{ color:var(--teal); }
</style>
</head>
<body>
<div id="app"></div>
<script>
  var TRIPS = [
    {
      id: "europa2026",
      title: "Europa 2026 — Bélgica &amp; Francia",
      startDate: "2026-09-12",
      endDate: "2026-10-14",
      items: [
        {
          type: "train",
          title: "Eurostar 9352 / SNCB 1536",
          from: "Amsterdam Centraal",
          to: "Brugge",
          start: "2026-09-19T13:10",
          end: "2026-09-19T16:26",
          provider: "TrainPal",
          confirmation: "1134747839941095",
          travelers: [],
          details: "Coach 16, seats 27–28 on Eurostar 9352 to Bruxelles Midi, then change to SNCB 1536 (any available seat) to Brugge. Eurostar Plus / SNCB First Class Connection, refundable and changeable. £267.00 total. Travelers not stated on the ticket — confirm who's on this one."
        },
        {
          type: "train",
          title: "SNCB 511",
          from: "Brugge",
          to: "Bruxelles Midi",
          start: "2026-09-22T11:58",
          end: "2026-09-22T12:53",
          provider: "SNCB (via TrainPal)",
          confirmation: "1134747839953051",
          travelers: ["Viviana Zimmermann", "Pablo Guardati"],
          details: "2nd class, Flex Adult (BE: Anytime) — refundable, non-exchangeable. £38.95 total."
        },
        {
          type: "hotel",
          title: "Apartment 1, town centre",
          start: "2026-09-25T16:00",
          end: "2026-10-03T10:00",
          provider: "Airbnb",
          confirmation: "HMKE9DH5EH",
          address: "5 North Pl, Cheltenham GL50 4DW, UK",
          travelers: [],
          details: "Hosted by Sally. Entire home/flat for 2 adults, £1,335.00 total for 8 nights. Free cancellation before 16:00 on 20 September; a partial refund applies after that but before check-in. Travelers not stated on the booking — confirm who's staying here."
        },
        {
          type: "train",
          title: "Trenitalia 6104",
          from: "Aix-En-Provence TGV",
          to: "Paris Gare de Lyon",
          start: "2026-10-11T10:25",
          end: "2026-10-11T13:34",
          provider: "TrainPal",
          confirmation: "1134747839910509",
          travelers: ["Paulina Guardati", "Viviana Zimmermann", "Pablo Guardati", "Francisco Grau"],
          details: "Standard Allegro (Serenità) fare, Coach 4 seats 6A, 6B, 7A, 7B. Refundable and exchangeable. Everyone together on this leg."
        },
        {
          type: "flight",
          title: "easyJet EZY6606",
          from: "Paris Charles de Gaulle (Terminal 2D)",
          to: "Birmingham",
          start: "2026-10-14T10:00",
          end: "2026-10-14T10:20",
          provider: "easyJet",
          confirmation: "KDB4XWR",
          travelers: ["Paulina Guardati", "Francisco Gonzalez Grau"],
          details: "Auto-assigned seats, small under-seat cabin bag only. €67.30 total."
        },
        {
          type: "train",
          title: "LNR / WMR / CrossCountry (1 change)",
          from: "Birmingham International",
          to: "Cheltenham Spa",
          start: "2026-10-14T11:04",
          end: "2026-10-14T12:14",
          provider: "TrainPal",
          confirmation: "1134747838549052",
          travelers: ["Paulina Guardati", "Francisco Gonzalez Grau"],
          details: "Connects straight off the easyJet flight above. 1 change at Birmingham New Street (stay on train at University). Split-ticket fare — mostly refundable/exchangeable, final CrossCountry leg non-refundable. £24.60 total."
        }
      ]
    }
  ];

  var ICONS = {
    plane:'<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
    bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3h4v-3a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v6"/><path d="M3 18h18"/><path d="M3 15v4M21 15v4"/><path d="M7 10V7a1 1 0 0 1 1-1h1"/></svg>',
    car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.4-4.2A2 2 0 0 1 8.3 5.4h7.4a2 2 0 0 1 1.9 1.4L19 11"/><rect x="3" y="11" width="18" height="6.5" rx="2"/><circle cx="7.5" cy="17.7" r="1.4"/><circle cx="16.5" cy="17.7" r="1.4"/></svg>',
    train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="13" rx="5"/><path d="M4 10h16"/><circle cx="8.5" cy="17.3" r="1.3"/><circle cx="15.5" cy="17.3" r="1.3"/><path d="M6.5 16l-2 4M17.5 16l2 4"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.9L20 9l-6.1 1.6L12 16l-1.9-5.4L4 9l6.1-1.1z"/></svg>',
    flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 5h12l-2.2 4L17 13H5"/></svg>',
    chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
  };
  var TYPE_ICON = { flight:'plane', hotel:'bed', car:'car', train:'train', activity:'star', note:'flag' };
  var TYPE_LABEL = { flight:'Flight', hotel:'Stay', car:'Car', train:'Train', activity:'Activity', note:'Note' };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function parseLocal(str){
    if (!str) return new Date(NaN);
    return new Date(str.indexOf('T') === -1 ? str + 'T00:00:00' : str);
  }
  function fmtDateHeading(dateStr){
    return parseLocal(dateStr).toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  }
  function fmtDateShort(dateStr){
    return parseLocal(dateStr).toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function fmtRange(a, b){
    var y1 = parseLocal(a).getFullYear(), y2 = parseLocal(b).getFullYear();
    return parseLocal(a).toLocaleDateString(undefined, { month:'short', day:'numeric', year: y1===y2?undefined:'numeric' })
      + ' → ' + parseLocal(b).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }
  function fmtTime(dt){
    if (!dt || dt.indexOf('T') === -1) return '';
    return parseLocal(dt).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  }

  var activeTripId = pickDefaultTrip();
  function pickDefaultTrip(){
    var today = new Date(); today.setHours(0,0,0,0);
    var upcoming = TRIPS.filter(function(t){ return parseLocal(t.endDate) >= today; })
      .sort(function(a,b){ return parseLocal(a.startDate) - parseLocal(b.startDate); });
    return (upcoming[0] || TRIPS[TRIPS.length-1] || {}).id;
  }

  function groupByDay(items){
    var sorted = items.slice().sort(function(a,b){ return parseLocal(a.start) - parseLocal(b.start); });
    var groups = [], byDate = {};
    sorted.forEach(function(item){
      var d = (item.start || '').slice(0,10);
      if (!byDate[d]) { byDate[d] = { date:d, items:[] }; groups.push(byDate[d]); }
      byDate[d].items.push(item);
    });
    return groups;
  }

  function fmtDateTime(dt){
    if (!dt) return '';
    var d = parseLocal(dt);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ', ' + fmtTime(dt);
  }

  function renderTravelers(item){
    if (!item.travelers || !item.travelers.length) return '';
    return '<div class="travelers">' + item.travelers.map(function(name){
      return '<span class="traveler-chip">' + esc(name.split(' ')[0]) + '</span>';
    }).join('') + '</div>';
  }

  function renderMain(item){
    var isRoute = item.type === 'flight' || item.type === 'train' || item.type === 'car';
    if (isRoute) {
      return (
        '<div class="item-route"><span class="t">' + fmtTime(item.start) + '</span> ' + esc(item.from || '') +
        '<span class="arrow">→</span><span class="t">' + fmtTime(item.end) + '</span> ' + esc(item.to || '') + '</div>' +
        '<div class="item-sub">' + esc(item.title) + '</div>' +
        renderTravelers(item)
      );
    }
    if (item.type === 'hotel') {
      return (
        '<div class="item-title">' + esc(item.title) + '</div>' +
        '<div class="item-route">' + fmtDateTime(item.start) + '<span class="arrow">→</span>' + fmtDateTime(item.end) + '</div>' +
        (item.address ? '<div class="item-loc">' + esc(item.address) + '</div>' : '') +
        renderTravelers(item)
      );
    }
    var time = fmtTime(item.start);
    var endBadge = '';
    if (item.end && item.end.slice(0,10) !== item.start.slice(0,10)) {
      endBadge = ' <span class="item-time">→ ' + fmtDateShort(item.end) + (fmtTime(item.end) ? ' ' + fmtTime(item.end) : '') + '</span>';
    }
    return (
      '<div class="item-time">' + (time || TYPE_LABEL[item.type] || '') + endBadge + '</div>' +
      '<div class="item-title">' + esc(item.title) + '</div>' +
      (item.location ? '<div class="item-loc">' + esc(item.location) + '</div>' : '') +
      renderTravelers(item)
    );
  }

  function renderItem(item){
    var icon = ICONS[TYPE_ICON[item.type] || 'flag'];
    var hasBottom = item.confirmation || item.provider;
    var hasDetails = !!item.details;
    var uid = 'd_' + Math.random().toString(36).slice(2,8);
    return (
      '<div class="item">' +
      '<div class="item-top">' +
        '<div class="item-icon ' + item.type + '">' + icon + '</div>' +
        '<div class="item-main">' + renderMain(item) + '</div>' +
      '</div>' +
      ((hasBottom || hasDetails) ? '<div class="tear"></div><div class="item-bottom"' + (hasDetails ? ' onclick="toggleDetails(\'' + uid + '\', this)"' : '') + '>' +
        '<div class="conf">' + esc(item.provider || '') + (item.confirmation ? (item.provider ? ' · ' : '') + 'Conf <b>' + esc(item.confirmation) + '</b>' : '') + '</div>' +
        (hasDetails ? '<span class="chevron">' + ICONS.chevron + '</span>' : '') +
      '</div>' : '') +
      (hasDetails ? '<div class="item-details" id="' + uid + '">' + esc(item.details || '') + '</div>' : '') +
      '</div>'
    );
  }

  function render(){
    var trip = TRIPS.find(function(t){ return t.id === activeTripId; });
    var app = document.getElementById('app');
    var html = '<div class="app-head">' + ICONS.plane + '<span>Family Visit Planner</span></div>';

    if (TRIPS.length > 1) {
      html += '<div class="trip-tabs">' + TRIPS.map(function(t){
        return '<button class="trip-tab" aria-selected="' + (t.id===activeTripId) + '" onclick="selectTrip(\'' + t.id + '\')">' + esc(t.title) + '</button>';
      }).join('') + '</div>';
    }

    if (trip) {
      var counts = { flight:0, other:0 };
      trip.items.forEach(function(i){ if (i.type==='flight') counts.flight++; else counts.other++; });
      var today = new Date(); today.setHours(0,0,0,0);
      var days = Math.round((parseLocal(trip.startDate) - today) / 86400000);
      var countdown = '';
      if (days > 1) countdown = '<div class="countdown"><b>' + days + '</b><span>days to go</span></div>';
      else if (days === 1) countdown = '<div class="countdown"><b>1</b><span>day to go</span></div>';
      else if (days === 0) countdown = '<div class="countdown"><b>Today</b><span>it starts</span></div>';
      else if (parseLocal(trip.endDate) >= today) countdown = '<div class="countdown"><b>Now</b><span>underway</span></div>';

      html += '<div class="hero">' +
        (countdown ? '<div class="hero-top"><span></span>' + countdown + '</div>' : '') +
        '<h1>' + trip.title + '</h1>' +
        '<div class="dates">' + fmtRange(trip.startDate, trip.endDate) + '</div>' +
        '<div class="stats">' +
          '<div class="stat"><b>' + counts.flight + '</b><span>Flight' + (counts.flight===1?'':'s') + '</span></div>' +
          '<div class="stat"><b>' + counts.other + '</b><span>Other bookings</span></div>' +
        '</div>' +
      '</div>';

      var groups = groupByDay(trip.items);
      groups.forEach(function(g){
        html += '<div class="day"><h2>' + fmtDateHeading(g.date) + '</h2><div class="items">' +
          g.items.map(renderItem).join('') + '</div></div>';
      });
    }

    html += '<div class="footer-note">Updated by asking Claude to edit this page and redeploy — ' +
      'see the <a href="https://github.com/fggraufaro/Travel-Plans" target="_blank" rel="noopener">source on GitHub</a>.</div>';

    app.innerHTML = html;
  }

  function selectTrip(id){ activeTripId = id; render(); }
  function toggleDetails(id, btn){
    var el = document.getElementById(id);
    el.classList.toggle('open');
    btn.querySelector('.chevron').classList.toggle('open');
  }

  render();
</script>
</body>
</html>
